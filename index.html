

<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CashFlow AI</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#f1f5f9;padding:16px}

.container{max-width:950px;margin:auto}

h1{color:#22c55e;margin-bottom:4px}

.subtitle{color:#94a3b8;margin-top:0}

.card{background:#151f30;border:1px solid #263448;border-radius:14px;padding:18px;margin:16px 0}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.stat{background:#1d293b;padding:16px;border-radius:12px}

.stat small{color:#94a3b8;display:block;margin-bottom:8px}

.stat strong{font-size:22px}

.green{color:#22c55e}

.red{color:#fb7185}

input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #34445a;font-size:15px}

input,select{background:#0d1726;color:white}

button{background:#22c55e;color:#06210e;font-weight:bold;border:0;cursor:pointer}

button.secondary{background:#334155;color:white}

button.danger{background:#7f1d1d;color:white}

button.whatsapp{background:#16a34a;color:white}

.item{background:#0f1928;padding:12px;border-radius:10px;margin:10px 0;border:1px solid #28374d}

.item strong{font-size:16px}

.item p{margin:6px 0;color:#cbd5e1}

hr{border:0;border-top:1px solid #263448;margin:16px 0}

h2{font-size:19px}

@media(min-width:650px){.stats{grid-template-columns:repeat(3,1fr)}}

</style>

</head>

<body>

<div class="container">

<h1>💚 CashFlow AI</h1>

<p class="subtitle">Gestion simple de tes ventes, dépenses et paiements.</p>

<div class="stats">

<div class="stat"><small>Ventes totales</small><strong id="totalSales">0 FCFA</strong></div>

<div class="stat"><small>Dépenses</small><strong id="totalExpenses">0 FCFA</strong></div>

<div class="stat"><small>Bénéfice</small><strong id="profit">0 FCFA</strong></div>

<div class="stat"><small>Argent encaissé</small><strong class="green" id="collected">0 FCFA</strong></div>

<div class="stat"><small>Dettes clients</small><strong class="red" id="debts">0 FCFA</strong></div>

<div class="stat"><small>Clients</small><strong id="clientCount">0</strong></div>

</div>

<div class="card">

<h2>👤 Ajouter un client</h2>

<input id="clientName" placeholder="Nom du client">

<input id="clientPhone" placeholder="Téléphone (ex : 77 123 45 67)">

<button onclick="addClient()">Ajouter le client</button>

</div>

<div class="card">

<h2>💰 Enregistrer une vente</h2>

<input id="saleName" placeholder="Nom du client (facultatif)">

<input id="saleAmount" type="number" min="0" placeholder="Montant total de la vente (FCFA)">

<input id="salePaid" type="number" min="0" placeholder="Montant payé aujourd'hui (FCFA)">

<button onclick="addSale()">Enregistrer la vente</button>

</div>

<div class="card">

<h2>📉 Enregistrer une dépense</h2>

<input id="expenseName" placeholder="Description de la dépense">

<input id="expenseAmount" type="number" min="0" placeholder="Montant (FCFA)">

<button onclick="addExpense()">Enregistrer la dépense</button>

</div>

<div class="card">

<h2>📋 Liste des clients</h2>

<div id="clientsList"></div>

</div>

<div class="card">

<h2>📜 Historique des opérations</h2>

<div id="history"></div>

</div>

</div>

<script>

const money = n => (Number(n)||0).toLocaleString("fr-FR")+" FCFA";

function readStore(key){

  try{return JSON.parse(localStorage.getItem(key)||"[]")}

  catch(e){return []}

}

let clients=readStore("cf_clients");

let operations=readStore("cashflow_operations");

function save(){

  localStorage.setItem("cf_clients",JSON.stringify(clients));

  localStorage.setItem("cashflow_operations",JSON.stringify(operations));

  render();

}

function normType(o){

  let t=String(o.type||"").toLowerCase();

  if(["sale","sales","vente","vendu"].includes(t))return "sale";

  if(["expense","expenses","dépense","depense"].includes(t))return "expense";

  return t;

}

function amount(o){return Number(o.amount||o.total||o.value||0)}

function saleName(o){return o.clientName||o.name||o.client||"Client"}

function paid(o){

  // Les anciennes ventes sont considérées comme déjà payées.

  if(o.paidAmount===undefined||o.paidAmount===null)return amount(o);

  return Math.min(amount(o),Math.max(0,Number(o.paidAmount)||0));

}

function due(o){return Math.max(0,amount(o)-paid(o))}

function phoneOf(c){return c.phone||c.telephone||c.tel||""}

function nameOf(c){return c.name||c.clientName||"Client"}

function phoneDigits(p){return String(p||"").replace(/\D/g,"")}

function whatsappLink(phone,message){

  let p=phoneDigits(phone);

  if(p.length===9)p="221"+p;

  return "https://wa.me/"+p+"?text="+encodeURIComponent(message);

}

function addClient(){

  const name=document.getElementById("clientName").value.trim();

  const phone=document.getElementById("clientPhone").value.trim();

  if(!name){alert("Entre le nom du client.");return;}

  clients.push({name,phone});

  document.getElementById("clientName").value="";

  document.getElementById("clientPhone").value="";

  save();

}

function addSale(){

  const name=document.getElementById("saleName").value.trim()||"Client";

  const total=Number(document.getElementById("saleAmount").value);

  const pInput=document.getElementById("salePaid").value;

  const paidNow=pInput===""?0:Number(pInput);

  if(!total||total<=0){alert("Entre un montant de vente valide.");return;}

  if(paidNow<0||paidNow>total){alert("Le montant payé doit être entre 0 et le montant total.");return;}

  operations.unshift({

    type:"sale",clientName:name,amount:total,paidAmount:paidNow,

    date:new Date().toISOString()

  });

  document.getElementById("saleName").value="";

  document.getElementById("saleAmount").value="";

  document.getElementById("salePaid").value="";

  save();

}

function addExpense(){

  const name=document.getElementById("expenseName").value.trim()||"Dépense";

  const total=Number(document.getElementById("expenseAmount").value);

  if(!total||total<=0){alert("Entre un montant de dépense valide.");return;}

  operations.unshift({type:"expense",name,amount:total,date:new Date().toISOString()});

  document.getElementById("expenseName").value="";

  document.getElementById("expenseAmount").value="";

  save();

}

function clientDue(name){

  return operations.filter(o=>normType(o)==="sale"&&saleName(o).toLowerCase()===name.toLowerCase())

    .reduce((s,o)=>s+due(o),0);

}

function clientSales(name){

  return operations.filter(o=>normType(o)==="sale"&&saleName(o).toLowerCase()===name.toLowerCase())

    .reduce((s,o)=>s+amount(o),0);

}

function addPayment(i){

  const o=operations[i];

  const remaining=due(o);

  if(remaining<=0){alert("Cette vente est déjà payée.");return;}

  const v=Number(prompt("Montant du paiement reçu (reste dû : "+money(remaining)+")"));

  if(!v||v<=0){return;}

  if(v>remaining){alert("Le montant dépasse le reste dû.");return;}

  o.paidAmount=paid(o)+v;

  save();

}

function deleteClient(i){

  if(confirm("Supprimer ce client ? Les ventes restent dans l'historique.")){

    clients.splice(i,1);save();

  }

}

function deleteOperation(i){

  if(confirm("Supprimer cette opération ?")){

    operations.splice(i,1);save();

  }

}

function render(){

  const sales=operations.filter(o=>normType(o)==="sale");

  const expenses=operations.filter(o=>normType(o)==="expense");

  const totalSales=sales.reduce((s,o)=>s+amount(o),0);

  const totalCollected=sales.reduce((s,o)=>s+paid(o),0);

  const totalDue=sales.reduce((s,o)=>s+due(o),0);

  const totalExpenses=expenses.reduce((s,o)=>s+amount(o),0);

  document.getElementById("totalSales").textContent=money(totalSales);

  document.getElementById("totalExpenses").textContent=money(totalExpenses);

  document.getElementById("profit").textContent=money(totalSales-totalExpenses);

  document.getElementById("collected").textContent=money(totalCollected);

  document.getElementById("debts").textContent=money(totalDue);

  document.getElementById("clientCount").textContent=clients.length;

  const cl=document.getElementById("clientsList");

  cl.innerHTML="";

  if(!clients.length)cl.innerHTML="<p>Aucun client pour le moment.</p>";

  clients.forEach((c,i)=>{

    const n=nameOf(c),ph=phoneOf(c),d=clientDue(n);

    const div=document.createElement("div");div.className="item";

    div.innerHTML="<strong>"+escapeHtml(n)+"</strong><p>Téléphone : "+escapeHtml(ph||"Non renseigné")+"</p><p>Ventes : "+money(clientSales(n))+"</p><p class='"+(d>0?"red":"green")+"'>Reste à payer : "+money(d)+"</p>";

    if(d>0&&ph){

      const msg="Bonjour "+n+", il reste "+money(d)+" à régler pour tes achats. Merci beaucoup 🙏";

      const b=document.createElement("button");b.className="whatsapp";b.textContent="📱 Rappel WhatsApp";

      b.onclick=()=>window.open(whatsappLink(ph,msg),"_blank");

      div.appendChild(b);

    }

    const del=document.createElement("button");del.className="danger";del.textContent="Supprimer le client";del.onclick=()=>deleteClient(i);

    div.appendChild(del);cl.appendChild(div);

  });

  const h=document.getElementById("history");h.innerHTML="";

  if(!operations.length)h.innerHTML="<p>Aucune opération enregistrée.</p>";

  operations.forEach((o,i)=>{

    const t=normType(o),div=document.createElement("div");div.className="item";

    const date=o.date?new Date(o.date).toLocaleDateString("fr-FR"):"";

    if(t==="sale"){

      const total=amount(o),p=paid(o),d=due(o);

      div.innerHTML="<strong>💰 Vente — "+escapeHtml(saleName(o))+"</strong><p>Date : "+escapeHtml(date)+"</p><p>Total : "+money(total)+"</p><p>Payé : "+money(p)+"</p><p class='"+(d>0?"red":"green")+"'>Reste dû : "+money(d)+"</p>";

      if(d>0){

        const b=document.createElement("button");b.textContent="💵 Encaisser un paiement";b.onclick=()=>addPayment(i);div.appendChild(b);

      }else{

        const ptag=document.createElement("p");ptag.textContent="✅ Payée";ptag.className="green";div.appendChild(ptag);

      }

    }else if(t==="expense"){

      div.innerHTML="<strong>📉 Dépense — "+escapeHtml(o.name||o.description||"Dépense")+"</strong><p>Date : "+escapeHtml(date)+"</p><p>Montant : "+money(amount(o))+"</p>";

    }else{

      div.innerHTML="<strong>"+escapeHtml(o.name||"Opération")+"</strong><p>"+money(amount(o))+"</p>";

    }

    const del=document.createElement("button");del.className="danger";del.textContent="Supprimer l'opération";del.onclick=()=>deleteOperation(i);

    div.appendChild(del);h.appendChild(div);

  });

}

function escapeHtml(s){

  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

}

render();

</script>

</body>

</html>

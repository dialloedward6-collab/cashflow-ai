

<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CashFlow AI</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:18px;background:#0b1220;color:white;font-family:Arial,sans-serif}

header{padding:15px 0}

h1{color:#39d98a;font-size:28px;margin-bottom:5px}

.sub,.label{color:#9ca3af}

.card{background:#172235;padding:18px;border-radius:14px;margin:14px 0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.value{font-size:20px;font-weight:bold;color:#39d98a;margin-top:9px}

input,select{width:100%;padding:14px;margin:7px 0;background:#26364c;color:white;border:0;border-radius:8px;font-size:16px}

button{padding:12px;border:0;border-radius:8px;background:#39d98a;color:#07130d;font-weight:bold;font-size:14px;margin-top:8px}

h2{font-size:19px}

li{list-style:none;padding:12px 0;border-bottom:1px solid #344258}

ul{padding:0;margin:0}

.secondary{background:#344258;color:white}

.danger{background:#a83d48;color:white}

small{color:#9ca3af}

.action{width:auto;margin-left:8px;padding:8px 10px}

.item{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.item-info{flex:1;min-width:140px}

</style>

</head>

<body>

<header>

<h1>CashFlow AI</h1>

<p class="sub">Votre gestion commerciale intelligente</p>

</header>

<h2>Tableau de bord</h2>

<div class="grid">

<div class="card"><div class="label">VENTES</div><div class="value" id="sales">0 FCFA</div></div>

<div class="card"><div class="label">DÉPENSES</div><div class="value" id="expenses">0 FCFA</div></div>

<div class="card"><div class="label">BÉNÉFICES</div><div class="value" id="profit">0 FCFA</div></div>

<div class="card"><div class="label">CLIENTS</div><div class="value" id="clientCount">0</div></div>

</div>

<div class="card">

<h2>Ajouter un client</h2>

<input id="clientName" placeholder="Nom du client">

<input id="clientPhone" type="tel" placeholder="Téléphone du client">

<button onclick="addClient()">+ Enregistrer le client</button>

</div>

<div class="card">

<h2>Mes clients</h2>

<input id="searchClient" placeholder="Rechercher un client..." oninput="renderClients()">

<ul id="clientList"></ul>

</div>

<div class="card">

<h2>Enregistrer une vente</h2>

<select id="saleClient"><option value="">Choisir un client (facultatif)</option></select>

<input id="saleName" placeholder="Nom du client si non enregistré">

<input id="saleAmount" type="number" min="1" placeholder="Montant en FCFA">

<button onclick="addSale()">+ Enregistrer la vente</button>

</div>

<div class="card">

<h2>Enregistrer une dépense</h2>

<input id="expenseName" placeholder="Description de la dépense">

<input id="expenseAmount" type="number" min="1" placeholder="Montant en FCFA">

<button onclick="addExpense()">+ Enregistrer la dépense</button>

</div>

<div class="card">

<h2>Historique des opérations</h2>

<ul id="history"></ul>

</div>

<script>

let clients=JSON.parse(localStorage.getItem("cf_clients")||"[]");

let operations=JSON.parse(localStorage.getItem("cashflow_operations")||"[]");

// Ajouter un identifiant aux anciennes opérations si nécessaire

operations.forEach(o=>{if(!o.id)o.id=Date.now()+Math.random()});

function money(n){

return Number(n).toLocaleString("fr-FR")+" FCFA";

}

function saveData(){

localStorage.setItem("cf_clients",JSON.stringify(clients));

localStorage.setItem("cashflow_operations",JSON.stringify(operations));

render();

}

function addClient(){

const name=document.getElementById("clientName").value.trim();

const phone=document.getElementById("clientPhone").value.trim();

if(!name){alert("Entrez le nom du client.");return;}

clients.push({id:Date.now(),name:name,phone:phone});

document.getElementById("clientName").value="";

document.getElementById("clientPhone").value="";

saveData();

alert("Client enregistré !");

}

function deleteClient(id){

const client=clients.find(c=>c.id===id);

if(!client)return;

if(confirm("Supprimer le client "+client.name+" ?")){

clients=clients.filter(c=>c.id!==id);

saveData();

}

}

function renderClients(){

const list=document.getElementById("clientList");

const search=document.getElementById("searchClient").value.toLowerCase();

list.innerHTML="";

clients.filter(c=>

(c.name||"").toLowerCase().includes(search)||

(c.phone||"").toLowerCase().includes(search)

).forEach(c=>{

const li=document.createElement("li");

const row=document.createElement("div");

row.className="item";

const info=document.createElement("div");

info.className="item-info";

const title=document.createElement("strong");

title.textContent=c.name;

const phone=document.createElement("div");

phone.textContent=c.phone||"Pas de téléphone";

phone.style.color="#9ca3af";

phone.style.marginTop="5px";

info.appendChild(title);

info.appendChild(phone);

const btn=document.createElement("button");

btn.className="danger action";

btn.textContent="Supprimer";

btn.onclick=()=>deleteClient(c.id);

row.appendChild(info);

row.appendChild(btn);

li.appendChild(row);

list.appendChild(li);

});

if(list.children.length===0){

const li=document.createElement("li");

li.textContent="Aucun client enregistré.";

list.appendChild(li);

}

}

function renderSelect(){

const select=document.getElementById("saleClient");

const selected=select.value;

select.innerHTML='<option value="">Choisir un client (facultatif)</option>';

clients.forEach(c=>{

const option=document.createElement("option");

option.value=c.id;

option.textContent=c.name;

select.appendChild(option);

});

select.value=selected;

}

function addSale(){

const clientId=document.getElementById("saleClient").value;

const manualName=document.getElementById("saleName").value.trim();

const client=clients.find(c=>String(c.id)===clientId);

const name=client?client.name:manualName;

const amount=Number(document.getElementById("saleAmount").value);

if(!name||!Number.isFinite(amount)||amount<=0){

alert("Choisissez un client ou entrez son nom et un montant valide.");

return;

}

operations.push({

id:Date.now()+Math.random(),

type:"sale",name:name,amount:amount,

date:new Date().toLocaleString("fr-FR")

});

document.getElementById("saleName").value="";

document.getElementById("saleAmount").value="";

document.getElementById("saleClient").value="";

saveData();

alert("Vente enregistrée !");

}

function addExpense(){

const name=document.getElementById("expenseName").value.trim();

const amount=Number(document.getElementById("expenseAmount").value);

if(!name||!Number.isFinite(amount)||amount<=0){

alert("Entrez une description et un montant valide.");

return;

}

operations.push({

id:Date.now()+Math.random(),

type:"expense",name:name,amount:amount,

date:new Date().toLocaleString("fr-FR")

});

document.getElementById("expenseName").value="";

document.getElementById("expenseAmount").value="";

saveData();

alert("Dépense enregistrée !");

}

function deleteOperation(id){

const op=operations.find(o=>o.id===id);

if(!op)return;

const label=op.type==="sale"?"vente":"dépense";

if(confirm("Supprimer cette "+label+" de "+money(op.amount)+" ?")){

operations=operations.filter(o=>o.id!==id);

saveData();

}

}

function render(){

const sales=operations.filter(o=>o.type==="sale")

.reduce((sum,o)=>sum+Number(o.amount),0);

const expenses=operations.filter(o=>o.type==="expense")

.reduce((sum,o)=>sum+Number(o.amount),0);

document.getElementById("sales").textContent=money(sales);

document.getElementById("expenses").textContent=money(expenses);

document.getElementById("profit").textContent=money(sales-expenses);

document.getElementById("clientCount").textContent=clients.length;

renderClients();

renderSelect();

const history=document.getElementById("history");

history.innerHTML="";

operations.slice().reverse().forEach(o=>{

const li=document.createElement("li");

const row=document.createElement("div");

row.className="item";

const info=document.createElement("div");

info.className="item-info";

info.textContent=(o.type==="sale"?"🟢 Vente : ":"🔴 Dépense : ")+

o.name+" — "+money(o.amount)+" — "+(o.date||"");

const btn=document.createElement("button");

btn.className="danger action";

btn.textContent="Supprimer";

btn.onclick=()=>deleteOperation(o.id);

row.appendChild(info);

row.appendChild(btn);

li.appendChild(row);

history.appendChild(li);

});

if(operations.length===0){

const li=document.createElement("li");

li.textContent="Aucune opération pour le moment.";

history.appendChild(li);

}

}

render();

</script>

</body>

</html>
